services:
  forge-studio:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      # .env must set DATABASE_URL (managed PostgreSQL), or STORAGE_BACKEND=json for an explicit single instance.
      # .env must also set TURNSTILE_SITE_KEY, TURNSTILE_SECRET and TURNSTILE_HOSTNAMES (Track A), or CAPTCHA_REQUIRED=false.
    volumes:
      - forge-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
volumes:
  forge-data:
