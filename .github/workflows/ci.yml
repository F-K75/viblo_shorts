name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (frontend + server)
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Browser E2E (Playwright)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Dependency audit (high+ fails the build)
        # GHSA-m9gg-hp2v-232j: @grpc/grpc-js via firebase/firestore, which this app never imports
        # (only firebase/app + firebase/auth). Re-evaluate on every firebase upgrade.
        run: bun audit --audit-level=high --ignore GHSA-m9gg-hp2v-232j

  live-llm:
    # Real provider tests run only when the secret is configured; they are reported as skipped otherwise.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: npm run test:live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forge-studio:ci .
      - name: Container smoke test
        run: |
          docker run -d --name fs -p 3000:3000 -e SESSION_SECRET=$(openssl rand -hex 32) -e TRUST_PROXY=none forge-studio:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/ready && break; sleep 2; done
          curl -fsS localhost:3000/api/ready
          curl -fsS -X POST localhost:3000/api/auth/guest | grep -q token
          # backup CLI is shipped in the image and can snapshot the live volume
          docker exec fs node --import tsx scripts/backup.ts create | grep -q '"created"'
          # production must refuse to start without an explicit TRUST_PROXY
          set +e; timeout 60 docker run --rm -e SESSION_SECRET=$(openssl rand -hex 32) forge-studio:ci; code=$?; set -e
          test "$code" = 1
          docker logs fs
